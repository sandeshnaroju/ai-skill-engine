<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 124" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&amp;family=Space+Grotesk:wght@700;800&amp;display=swap');
      
      .font-hero-base { 
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      }
      
      .font-hero-engine { 
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; 
        font-weight: 800; 
        font-size: 20px; 
        letter-spacing: 0.12em; 
      }
    </style>

    <linearGradient id="heroCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="heroPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="heroViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="heroAiViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="heroSkillBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <linearGradient id="heroEngineCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Centered Enlarged Hero Logo Icon (72px Diameter) -->
  <g transform="translate(60, 38)">
    <!-- Pill 1 (Top) -->
    <rect x="-6.5" y="-35" width="13" height="24" rx="6.5" fill="url(#heroCyan)" />
    <!-- Pill 2 (Bottom Right) -->
    <g transform="rotate(120)">
      <rect x="-6.5" y="-35" width="13" height="24" rx="6.5" fill="url(#heroPurple)" />
    </g>
    <!-- Pill 3 (Bottom Left) -->
    <g transform="rotate(240)">
      <rect x="-6.5" y="-35" width="13" height="24" rx="6.5" fill="url(#heroViolet)" />
    </g>
    <!-- Center AI Core Dot -->
    <circle cx="0" cy="0" r="4.5" fill="#00F2FE" />
  </g>

  <!-- Centered Typography (Tight Zero-Padding) -->
  <g transform="translate(60, 0)" text-anchor="middle">
    <!-- Line 1: AI SKILL -->
    <text y="95" class="font-hero-base" font-size="18">
      <tspan font-weight="900" fill="url(#heroAiViolet)" letter-spacing="0.05em">AI </tspan>
      <tspan font-weight="700" fill="url(#heroSkillBlue)" letter-spacing="0.07em">SKILL</tspan>
    </text>

    <!-- Line 2: ENGINE -->
    <text y="118" class="font-hero-engine" fill="url(#heroEngineCyan)">
      ENGINE
    </text>
  </g>
</svg>