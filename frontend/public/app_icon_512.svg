<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="appBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0D1527" /><stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="appCyan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00F2FE" /><stop offset="100%" stop-color="#2563EB" /></linearGradient>
    <linearGradient id="appPurple" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38BDF8" /><stop offset="100%" stop-color="#7C3AED" /></linearGradient>
    <linearGradient id="appViolet" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B5CF6" /><stop offset="100%" stop-color="#00F2FE" /></linearGradient>
    <filter id="appGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  
  <!-- Squircle Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#appBg)" stroke="#1E293B" stroke-width="4" />
  <circle cx="256" cy="256" r="160" fill="#00F2FE" opacity="0.08" filter="url(#appGlow)" />
  
  <!-- Centered App Icon Mark -->
  <g transform="translate(256, 256)" filter="url(#appGlow)">
    <rect x="-32" y="-160" width="64" height="110" rx="32" fill="url(#appCyan)" />
    <g transform="rotate(120)"><rect x="-32" y="-160" width="64" height="110" rx="32" fill="url(#appPurple)" /></g>
    <g transform="rotate(240)"><rect x="-32" y="-160" width="64" height="110" rx="32" fill="url(#appViolet)" /></g>
    <circle cx="0" cy="0" r="24" fill="#00F2FE" />
  </g>
</svg>