version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_skill_engine
    ports:
      - "2704:2704"
    environment:
      - HOST_SANDBOX_DIR=${PWD}/sandbox
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandbox:/app/sandbox
      - ./skills:/app/skills
      - ./skill_manager.db:/app/skill_manager.db
      - ./.env:/app/.env
    restart: unless-stopped
